plugins {
    id("com.gradleup.shadow") version "9.4.1"
    id("io.micronaut.application") version "5.0.2"
    id("io.micronaut.test-resources") version "5.0.2"
    id("io.micronaut.aot") version "5.0.2"
    id("io.micronaut.openapi") version "5.0.2"
}

version = "0.1"
group = "uk.ac.york.cs.eng2.books"

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor("io.micronaut.data:micronaut-data-processor")
    annotationProcessor("io.micronaut:micronaut-http-validation")
    annotationProcessor("io.micronaut.openapi:micronaut-openapi")
    annotationProcessor("io.micronaut.serde:micronaut-serde-processor")
    implementation("io.micronaut.data:micronaut-data-hibernate-jpa")
    implementation("io.micronaut.flyway:micronaut-flyway")
    implementation("io.micronaut.serde:micronaut-serde-jackson")
    implementation("io.micronaut.sql:micronaut-jdbc-hikari")
    implementation("io.micronaut:micronaut-http-client")
    compileOnly("io.micronaut.openapi:micronaut-openapi-annotations")
    runtimeOnly("ch.qos.logback:logback-classic")
    runtimeOnly("org.flywaydb:flyway-mysql")
    runtimeOnly("org.mariadb.jdbc:mariadb-java-client")
    testImplementation("org.mockito:mockito-core:5.15.2")
}


application {
    mainClass = "uk.ac.york.cs.eng2.books.Application"
}
java {
    sourceCompatibility = JavaVersion.toVersion("25")
    targetCompatibility = JavaVersion.toVersion("25")
}


graalvmNative.toolchainDetection = false

micronaut {
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("uk.ac.york.cs.eng2.books.*")
    }
    aot {
        // Please review carefully the optimizations enabled below
        // Check https://micronaut-projects.github.io/micronaut-aot/latest/guide/ for more details
        optimizeServiceLoading = false
        convertYamlToJava = false
        precomputeOperations = true
        cacheEnvironment = true
        optimizeClassLoading = true
        deduceEnvironment = true
        optimizeNetty = true
        replaceLogbackXml = true
    }
    openapi {
        client("openlibrary", file("src/main/openapi/openlibrary-1.0.0.json")) {
            apiPackageName = "uk.ac.york.cs.eng2.books.openlibrary.api"
            modelPackageName = "uk.ac.york.cs.eng2.books.openlibrary.model"
            clientId = "openlibrary"
            useReactive = false
            // SearchResponse has both "numFound" and "num_found", which would produce duplicate getters/setters
            nameMapping = ["num_found": "numFoundSnakeCase"]
        }
    }
}


tasks.named("dockerfileNative") {
    jdkVersion = "25"
}


